name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Format, lint, test, and measure complexity
        run: make check
      - name: Explore an additional reproducible property-test seed
        env:
          ROOST_TEST_SEED: ${{ github.run_number }}
          QUICKCHECK_TESTS: 1000
        run: cargo test --locked property_
