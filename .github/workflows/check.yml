name: Rust checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Format, lint, test, and measure complexity
        run: make check
      - name: Verify crate package
        run: make package
      - name: Install dependency security tooling
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked dependencies
        run: make security
      - name: Explore an additional reproducible property-test seed
        env:
          MYSESSIONS_TEST_SEED: ${{ github.run_number }}
          QUICKCHECK_TESTS: 1000
        run: cargo test --locked property_
      - name: Install coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Enforce line coverage
        run: make coverage
